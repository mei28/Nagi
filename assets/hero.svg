<svg width="1280" height="600" viewBox="0 0 1280 600" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Night-sea background (matches the Nagi moon-over-sea logo) -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1430"/>
      <stop offset="0.62" stop-color="#0e1d40"/>
      <stop offset="0.62" stop-color="#123a6b"/>
      <stop offset="1" stop-color="#0c2b54"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfd8ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#cfd8ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e7e3cf"/>
      <stop offset="0.5" stop-color="#f3edcf"/>
      <stop offset="1" stop-color="#fbf6d8"/>
    </linearGradient>
    <!-- Frosted glass panel -->
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <!-- Time Timer working sweep: blue -> indigo -> purple -->
    <linearGradient id="timerSweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="0.5" stop-color="#6a5cff"/>
      <stop offset="1" stop-color="#a45cff"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="blurBig" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="moonSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="600" fill="url(#sky)"/>
  <!-- horizon line -->
  <rect x="0" y="372" width="1280" height="1.5" fill="#ffffff" opacity="0.10"/>

  <!-- Big ambient moon glow on the right (brand) -->
  <circle cx="980" cy="250" r="300" fill="url(#moonGlow)" filter="url(#blurBig)"/>

  <!-- Sea ripples (calm = nagi) -->
  <g fill="#cfd8ee" opacity="0.16">
    <ellipse cx="250" cy="430" rx="70" ry="3"/>
    <ellipse cx="180" cy="470" rx="48" ry="3"/>
    <ellipse cx="320" cy="500" rx="60" ry="3"/>
    <ellipse cx="150" cy="540" rx="40" ry="2.5"/>
    <ellipse cx="1050" cy="455" rx="80" ry="3"/>
    <ellipse cx="1150" cy="510" rx="55" ry="3"/>
  </g>

  <!-- ============ LEFT: Brand / copy ============ -->
  <g transform="translate(80, 138)">
    <!-- moon mark (logo motif) -->
    <g>
      <rect x="0" y="0" width="58" height="58" rx="15" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.18"/>
      <circle cx="29" cy="27" r="15" fill="url(#moon)" filter="url(#moonSoft)"/>
      <ellipse cx="34" cy="22" rx="4" ry="2.4" fill="#ffffff" opacity="0.55"/>
      <!-- little ripple under moon -->
      <ellipse cx="29" cy="47" rx="13" ry="1.6" fill="#cfd8ee" opacity="0.35"/>
      <ellipse cx="29" cy="51" rx="8" ry="1.3" fill="#cfd8ee" opacity="0.25"/>
    </g>

    <text x="78" y="26" fill="#ffffff" font-size="30" font-weight="700" letter-spacing="0.5">Nagi <tspan fill="#cdd6ee" font-weight="500" font-family="'Droid Sans Fallback', sans-serif">凪</tspan></text>
    <text x="78" y="48" fill="#9fb0d6" font-size="13.5" font-weight="500" letter-spacing="2">FLOW-TIME SESSION TRACKER</text>

    <text x="0" y="132" fill="#ffffff" font-size="46" font-weight="800">Work in flow.</text>
    <text x="0" y="186" fill="#ffffff" font-size="46" font-weight="800">Rest in proportion.</text>

    <text x="2" y="228" fill="#aab8dc" font-size="16.5" font-weight="500">The calm interval between focus and rest.</text>

    <!-- feature rows -->
    <g transform="translate(2, 270)" fill="#c6d2ee" font-size="15.5" font-weight="500">
      <g>
        <circle cx="11" cy="-5" r="11" fill="#6a5cff" fill-opacity="0.22"/>
        <path d="M5 -5 l4 4 l8 -9" stroke="#9b8cff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="0">Flow time — break = work × 20%, not a fixed clock</text>
      </g>
      <g transform="translate(0,40)">
        <circle cx="11" cy="-5" r="11" fill="#6a5cff" fill-opacity="0.22"/>
        <path d="M5 -5 l4 4 l8 -9" stroke="#9b8cff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="0">Time Timer–style circular timer &amp; menu-bar mode</text>
      </g>
      <g transform="translate(0,80)">
        <circle cx="11" cy="-5" r="11" fill="#6a5cff" fill-opacity="0.22"/>
        <path d="M5 -5 l4 4 l8 -9" stroke="#9b8cff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="0">On-device only — zero network traffic</text>
      </g>
    </g>

    <!-- badge -->
    <g transform="translate(2, 392)">
      <rect x="0" y="0" width="232" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="18" cy="15" r="4" fill="#5aa0ff"/>
      <text x="32" y="20" fill="#bcc8e6" font-size="13" font-weight="600">macOS · SwiftUI · Liquid Glass</text>
    </g>
  </g>

  <!-- ============ Menu bar + connector ============ -->
  <g transform="translate(640, 50)">
    <rect x="0" y="0" width="600" height="30" rx="8" fill="#ffffff" fill-opacity="0.07"/>
    <g fill="#c6d2ee" opacity="0.7">
      <circle cx="470" cy="15" r="3"/>
      <rect x="496" y="9" width="16" height="12" rx="2" fill="none" stroke="#c6d2ee" stroke-width="1.6"/>
      <text x="540" y="20" font-size="12" font-weight="600" fill="#c6d2ee">9:41</text>
    </g>
    <!-- active Nagi menu bar icon: crescent moon -->
    <g transform="translate(424,7)">
      <rect x="-7" y="-3" width="30" height="24" rx="6" fill="#6a5cff" fill-opacity="0.30"/>
      <path d="M13 1 a7 7 0 1 0 4 13 a8.5 8.5 0 0 1 -4 -13 Z" fill="#eaf1ff"/>
    </g>
    <path d="M431 23 l9 9 l9 -9 Z" fill="url(#glass)"/>
  </g>

  <!-- ============ Menu-bar popover ============ -->
  <g transform="translate(792, 86)" filter="url(#softShadow)">
    <rect x="0" y="0" width="356" height="418" rx="20" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.18"/>
    <rect x="1" y="1" width="354" height="58" rx="19" fill="#ffffff" fill-opacity="0.03"/>

    <!-- Header -->
    <text x="22" y="36" fill="#ffffff" font-size="16" font-weight="600">Nagi</text>
    <g transform="translate(286,18)">
      <rect x="0" y="0" width="50" height="22" rx="11" fill="#6a5cff" fill-opacity="0.22"/>
      <circle cx="13" cy="11" r="4" fill="#9b8cff"/>
      <text x="22" y="15" fill="#c9d2f0" font-size="11" font-weight="600">Work</text>
    </g>

    <!-- Circular Time Timer -->
    <g transform="translate(178, 158)">
      <!-- track -->
      <circle cx="0" cy="0" r="78" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="16"/>
      <!-- working sweep (~70%) blue->indigo->purple, starting at top, clockwise -->
      <path d="M 0 -78 A 78 78 0 1 1 -74.2 24.1" fill="none" stroke="url(#timerSweep)" stroke-width="16" stroke-linecap="round"/>
      <!-- inner disc -->
      <circle cx="0" cy="0" r="58" fill="#0e1733" fill-opacity="0.55"/>
      <text x="0" y="-2" fill="#ffffff" font-size="34" font-weight="700" text-anchor="middle" letter-spacing="1">24:18</text>
      <text x="0" y="22" fill="#9fb0d6" font-size="12" font-weight="500" text-anchor="middle" letter-spacing="1">lap 2 · focusing</text>
    </g>

    <!-- Primary button (Stop) -->
    <g transform="translate(98, 262)">
      <rect x="0" y="0" width="160" height="38" rx="19" fill="url(#timerSweep)"/>
      <rect x="68" y="13" width="12" height="12" rx="2.5" fill="#ffffff"/>
      <text x="92" y="24" fill="#ffffff" font-size="14" font-weight="600">Stop</text>
    </g>

    <line x1="20" y1="322" x2="336" y2="322" stroke="#ffffff" stroke-opacity="0.12"/>

    <!-- GitHub-style heatmap (last 10 weeks) -->
    <text x="22" y="346" fill="#9fb0d6" font-size="11" font-weight="600" letter-spacing="0.5">LAST 10 WEEKS</text>
    <g transform="translate(22, 356)">
      <!-- 10 cols x 7 rows; fill levels via opacity of blue -->
      <!-- generated grid -->
      <g fill="#5aa0ff">
        <!-- row pattern hand-tuned for a pleasant look -->
        <rect x="0"  y="0"  width="9" height="9" rx="2" opacity="0.12"/><rect x="13" y="0" width="9" height="9" rx="2" opacity="0.30"/><rect x="26" y="0" width="9" height="9" rx="2" opacity="0.55"/><rect x="39" y="0" width="9" height="9" rx="2" opacity="0.18"/><rect x="52" y="0" width="9" height="9" rx="2" opacity="0.75"/><rect x="65" y="0" width="9" height="9" rx="2" opacity="0.40"/><rect x="78" y="0" width="9" height="9" rx="2" opacity="0.90"/><rect x="91" y="0" width="9" height="9" rx="2" opacity="0.30"/><rect x="104" y="0" width="9" height="9" rx="2" opacity="0.60"/><rect x="117" y="0" width="9" height="9" rx="2" opacity="0.20"/>
        <rect x="0"  y="13" width="9" height="9" rx="2" opacity="0.40"/><rect x="13" y="13" width="9" height="9" rx="2" opacity="0.18"/><rect x="26" y="13" width="9" height="9" rx="2" opacity="0.70"/><rect x="39" y="13" width="9" height="9" rx="2" opacity="0.90"/><rect x="52" y="13" width="9" height="9" rx="2" opacity="0.30"/><rect x="65" y="13" width="9" height="9" rx="2" opacity="0.55"/><rect x="78" y="13" width="9" height="9" rx="2" opacity="0.20"/><rect x="91" y="13" width="9" height="9" rx="2" opacity="0.75"/><rect x="104" y="13" width="9" height="9" rx="2" opacity="0.45"/><rect x="117" y="13" width="9" height="9" rx="2" opacity="0.85"/>
        <rect x="0"  y="26" width="9" height="9" rx="2" opacity="0.20"/><rect x="13" y="26" width="9" height="9" rx="2" opacity="0.60"/><rect x="26" y="26" width="9" height="9" rx="2" opacity="0.35"/><rect x="39" y="26" width="9" height="9" rx="2" opacity="0.55"/><rect x="52" y="26" width="9" height="9" rx="2" opacity="0.90"/><rect x="65" y="26" width="9" height="9" rx="2" opacity="0.25"/><rect x="78" y="26" width="9" height="9" rx="2" opacity="0.65"/><rect x="91" y="26" width="9" height="9" rx="2" opacity="0.40"/><rect x="104" y="26" width="9" height="9" rx="2" opacity="0.80"/><rect x="117" y="26" width="9" height="9" rx="2" opacity="0.30"/>
        <rect x="0"  y="39" width="9" height="9" rx="2" opacity="0.55"/><rect x="13" y="39" width="9" height="9" rx="2" opacity="0.85"/><rect x="26" y="39" width="9" height="9" rx="2" opacity="0.18"/><rect x="39" y="39" width="9" height="9" rx="2" opacity="0.45"/><rect x="52" y="39" width="9" height="9" rx="2" opacity="0.60"/><rect x="65" y="39" width="9" height="9" rx="2" opacity="0.90"/><rect x="78" y="39" width="9" height="9" rx="2" opacity="0.35"/><rect x="91" y="39" width="9" height="9" rx="2" opacity="0.55"/><rect x="104" y="39" width="9" height="9" rx="2" opacity="0.25"/><rect x="117" y="39" width="9" height="9" rx="2" opacity="0.70"/>
        <rect x="0"  y="52" width="9" height="9" rx="2" opacity="0.30"/><rect x="13" y="52" width="9" height="9" rx="2" opacity="0.50"/><rect x="26" y="52" width="9" height="9" rx="2" opacity="0.80"/><rect x="39" y="52" width="9" height="9" rx="2" opacity="0.20"/><rect x="52" y="52" width="9" height="9" rx="2" opacity="0.40"/><rect x="65" y="52" width="9" height="9" rx="2" opacity="0.65"/><rect x="78" y="52" width="9" height="9" rx="2" opacity="0.90"/><rect x="91" y="52" width="9" height="9" rx="2" opacity="0.30"/><rect x="104" y="52" width="9" height="9" rx="2" opacity="0.55"/><rect x="117" y="52" width="9" height="9" rx="2" opacity="0.45"/>
      </g>
      <!-- legend -->
      <g transform="translate(0, 80)" fill="#5aa0ff">
        <text x="0" y="8" fill="#9fb0d6" font-size="10" font-weight="500" opacity="1">Less</text>
        <rect x="30" y="0" width="9" height="9" rx="2" opacity="0.15"/>
        <rect x="42" y="0" width="9" height="9" rx="2" opacity="0.38"/>
        <rect x="54" y="0" width="9" height="9" rx="2" opacity="0.60"/>
        <rect x="66" y="0" width="9" height="9" rx="2" opacity="0.82"/>
        <rect x="78" y="0" width="9" height="9" rx="2" opacity="1"/>
        <text x="92" y="8" fill="#9fb0d6" font-size="10" font-weight="500">More</text>
      </g>
    </g>
  </g>

  <!-- ============ flow loop hint (focus <-> rest) ============ -->
  <g opacity="0.85">
    <path d="M610 300 q70 -70 150 -40" stroke="#9b8cff" stroke-width="2.2" fill="none" stroke-dasharray="2 9" stroke-linecap="round"/>
    <path d="M752 252 l16 8 l-12 12 Z" fill="#9b8cff"/>
    <text x="560" y="250" fill="#a9b6dc" font-size="13" font-weight="600">work →</text>
    <text x="585" y="328" fill="#8fe3b8" font-size="13" font-weight="600">→ break (20%)</text>
  </g>
</svg>
